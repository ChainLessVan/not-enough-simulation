<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monofett&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik+Glitch&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>

    <!--put everything inside the main_menu container for the main screen/starting menu -->
    <div id="main_menu">
        <audio id="MainMusic" src="MainMenuBackground.mp3" loop></audio>
        <div class="title1Div"><h1 class="title1" id="target">too much simulation</h1></div>
        <div class="homeButtonDiv"><button class="homeButton" onclick="opengames()" id="trigger">PLAY</button></div>
        <div class="homeButtonDiv"> <button class="homeButton" onclick="opensettings()"> SETTINGS</button></div>
        <div class="footer">
            <span><h2 class="whiteText">Made by h.i.</h2><h2 class="greenText">incorporated</h2></span>
        </div>
    </div>


    <div id="speedtype" style="display:none;">
        <span>
            <h2>speedtyper</h2>
            <p id="wordToType"></p>

            <input id="typeInput" type="text" placeholder="Type here">
            <div id="wrongFlashPlacement">
                <h3 id="WrongFlash" style="display: none;"> WRONG</h3>
            </div>
            <h3 id="WrongFlash" style="display: none;"> WRONG</h3>
            <p id="timer">Time: 10</p>
            <p id="score">Score: 0</p>
            <button class="return" onclick="returnFromType()"> Back </button>
        </span>
    </div>



    <div id="settings" style="display:none;">
        <span>
            <div class="settingsBox">
                <h2 class="Text">Settings</h2>
                <span class="VolumeSlider">
                    <div class="volumeBox">
                        <p class="Text">Volume</p>
                    </div>
                    <input type="range" id="volumeControl" min="0" max="100" value="50"> <!--we add extra later-->
                </span>
                <button class="return" onclick="returnFromSettings()">Back</button>
            </div>
        </span>
    </div>



    <div id="gameMenu" style="display:none;">
        <span style="padding: auto;">
            <h2 class="title2">Select your game.</h2>
            <div class="gamesContainer">
                <h2 class="gamesText">Typeracer</h2>
                <p class="gameDescription">A normal typing game, or is it?</p>
                <p class="gameDescription"><strong>WARNING: EPYLEPSY</strong></p>
                <button class="enterGame" onclick="opentyperace()">Enter</button>
            </div>
            <button class="return" onclick="back1()">Back</button>
        </span>
    </div>





    <script src="script.js"></script>
</body>
</html>
